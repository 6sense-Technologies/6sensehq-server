services:

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot
    networks:
      - 6sensehq_net

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    depends_on:
      - nginx
    volumes:
      - ./nginx/ssl:/etc/letsencrypt            # certs & renewal configs
      - ./nginx/certbot-webroot:/var/www/certbot # ACME webroot (MUST match nginx)
      - /var/run/docker.sock:/var/run/docker.sock:ro # Access to Docker socket for reloading nginx
    networks:
      - 6sensehq_net
    # Retired domains - never reissue or renew these certificates:
    #   depshield-api.6sensehq.com
    #   depshield.6sensehq.com
    #   sami.6sensehq.com
    #   sign.6sensehq.com
    # `certbot renew` picks up every file in nginx/ssl/renewal/, so remove them on the server with:
    #   docker exec certbot certbot delete --cert-name <domain>
    entrypoint: >
      /bin/sh -c 'apk add --no-cache docker-cli;
      trap exit TERM;
      while :; do
        certbot renew --deploy-hook "docker exec nginx nginx -s reload";
        sleep 12h & wait $${!};
      done'

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/log:/var/log:ro
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /run/promtail:/run/promtail
      - /etc/hostname:/etc/hostname:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    command: -config.file=/etc/promtail/promtail-config.yaml
    restart: unless-stopped
    networks:
      - 6sensehq_net

networks:
  6sensehq_net:
    external: true
    name: 6sensehq-network
